name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you saw
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, hook payloads or MCP calls, as minimal as possible
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `node -v`, `claude --version` (if relevant) and the commit of this repository
    validations:
      required: true
